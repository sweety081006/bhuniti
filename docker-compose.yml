name: bhuniti

# Infrastructure only. The backend (FastAPI) and frontend (Next.js) run on the
# host so that model downloads and hot-reload are fast during the hackathon.
#   docker compose up -d                 -> postgres + qdrant + minio  (light)
#   docker compose --profile full up -d  -> also elasticsearch          (heavy)

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhuniti-postgres
    environment:
      POSTGRES_USER: bhuniti
      POSTGRES_PASSWORD: bhuniti
      POSTGRES_DB: bhuniti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhuniti -d bhuniti"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: bhuniti-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: bhuniti-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bhuniti
      MINIO_ROOT_PASSWORD: bhuniti123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data

  # Optional: hybrid keyword search. Needs ~1.5 GB RAM.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: bhuniti-elasticsearch
    profiles: ["full"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  pgdata:
  qdrant_storage:
  minio_data:
  es_data:
